x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  environment:
    DJANGO_ENV: production
    DB_ENGINE: postgresql
    DB_HOST: db
    DB_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-invoice_desk}
      POSTGRES_USER: ${DB_USER:-invoice_desk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    volumes: [static_files:/app/staticfiles]
  worker:
    <<: *backend
    command: ["celery", "-A", "configuration", "worker", "--loglevel=info"]
  beat:
    <<: *backend
    command: ["celery", "-A", "configuration", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
volumes:
  postgres_data:
  redis_data:
  static_files:
